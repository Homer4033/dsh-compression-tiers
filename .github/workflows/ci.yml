name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # This plugin is developed on Windows (junctions, taskkill, registry proxy)
    # and must keep working on Linux, so both are exercised.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test
        run: npm test
      - name: Secret scan
        run: node scripts/check-secrets.mjs
        if: always()
